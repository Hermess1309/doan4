name: Java 21 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        # Includes validation of checked-in Gradle Wrapper JARs.
      - name: Build, tests, formatting and launchers
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain clean spotlessCheck build :cli:installDist :desktop:installDist
      - name: Smoke test Ubuntu launchers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./cli/build/install/cli/bin/cli help
          xvfb-run -a ./desktop/build/install/desktop/bin/desktop --smoke-test
      - name: Smoke test Windows launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\cli\build\install\cli\bin\cli.bat help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\desktop\build\install\desktop\bin\desktop.bat --smoke-test
          exit $LASTEXITCODE
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/*.xml
          if-no-files-found: warn
